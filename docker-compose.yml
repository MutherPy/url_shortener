services:
  url_db:
    image: postgres:18
    ports:
      - "5432:5432"
    volumes:
      - ./pg_dump:/var/lib/postgresql/18/docker
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - shortener

  app:
    build:
      context: .
    volumes:
      - .:/app:ro
    ports:
      - "8000:8000"
    env_file:
      - .env
    command: sh -c "python -m pip install -r requirements.txt && python -m alembic upgrade head && python main.py"
    environment:
      POSTGRES_HOST: url_db
      POSTGRES_PORT: "5432"
      BASE_HOST: ${BASE_HOST:-http://localhost:8000}
      CACHE_SIZE: ${CACHE_SIZE:-1000}
    depends_on:
      url_db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 120s
    networks:
      - shortener

  k6:
    image: grafana/k6:2.4.0
    profiles:
      - load
    command: ["run", "/scripts/shortener.js"]
    environment:
      BASE_URL: http://app:8000
      CODE: Bjh
    volumes:
      - ./k6:/scripts
    depends_on:
      app:
        condition: service_healthy
    networks:
      - shortener

networks:
  shortener:
    driver: bridge
